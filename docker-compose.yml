name: ${COMPOSE_PROJECT_NAME:-central-vendas-link-brasil}

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    image: central-vendas-link-brasil-web:local
    restart: unless-stopped
    init: true
    env_file:
      - .env
    environment:
      DASHBOARD_DATABASE_URL: ${DASHBOARD_DATABASE_URL:?Configure DASHBOARD_DATABASE_URL no arquivo .env}
      SUPABASE_URL: ${SUPABASE_URL:?Configure SUPABASE_URL no arquivo .env}
      SUPABASE_PUBLISHABLE_KEY: ${SUPABASE_PUBLISHABLE_KEY:?Configure SUPABASE_PUBLISHABLE_KEY no arquivo .env}
      SUPABASE_SERVER_KEY: ${SUPABASE_SERVER_KEY:?Configure SUPABASE_SERVER_KEY no arquivo .env}
      APP_ORIGIN: ${APP_ORIGIN:?Configure APP_ORIGIN no arquivo .env}
      IMPORT_QUEUE: ${IMPORT_QUEUE:-pgmq}
      IMPORT_BUCKET: ${IMPORT_BUCKET:-link-brasil-importacoes}
      PGSSLMODE: ${PGSSLMODE:-require}
      TZ: ${TZ:-America/Sao_Paulo}
    ports:
      - "${WEB_BIND_ADDRESS:-127.0.0.1}:${APP_PORT:-3000}:3000"
    cpus: ${WEB_CPUS:-0.50}
    mem_limit: ${WEB_MEMORY_LIMIT:-384m}
    pids_limit: 256
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
      - /app/.next/cache:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  importer:
    build:
      context: .
      dockerfile: Dockerfile.worker
    image: central-vendas-link-brasil-importer:local
    restart: unless-stopped
    init: true
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL:?Configure DATABASE_URL no arquivo .env}
      SUPABASE_URL: ${SUPABASE_URL:?Configure SUPABASE_URL no arquivo .env}
      SUPABASE_SERVER_KEY: ${SUPABASE_SERVER_KEY:?Configure SUPABASE_SERVER_KEY no arquivo .env}
      IMPORT_QUEUE: ${IMPORT_QUEUE:-pgmq}
      IMPORT_BUCKET: ${IMPORT_BUCKET:-link-brasil-importacoes}
      PGSSLMODE: ${PGSSLMODE:-require}
      TZ: ${TZ:-America/Sao_Paulo}
    cpus: ${WORKER_CPUS:-0.50}
    mem_limit: ${WORKER_MEMORY_LIMIT:-512m}
    pids_limit: 256
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 5m
    healthcheck:
      test: ["CMD", "python", "-m", "worker.run", "--check"]
      interval: 1m
      timeout: 30s
      retries: 3
      start_period: 30s

